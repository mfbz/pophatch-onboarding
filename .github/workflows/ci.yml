name: CI

# One job, not one per check (messages, format, lint, typecheck, test, build): each job pays its own `npm ci` and GitHub bills every job rounded up
# to the minute.
on:
  pull_request:
  push:
    branches: [main]

# A superseded push should not keep a runner busy; the newest commit wins.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # A healthy run takes a few minutes; a hung step would otherwise bill GitHub's default of six hours.
    timeout-minutes: 15
    # Every check runs even after an earlier one fails, so a pull request learns all of what is
    # wrong from one run.
    steps:
      - uses: actions/checkout@v7
        with:
          # The message guards read every commit since the base branch.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: install
        name: Install
        run: npm ci
      # Untrusted text reaches the script through the environment, never the command line.
      - name: Messages
        if: ${{ !cancelled() && steps.install.outcome == 'success' && github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: npx tsx checks/messages.ts "origin/$BASE_REF"
      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test
      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
